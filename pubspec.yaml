name: gameon
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  url_launcher: ^6.1.14
  flutter_dotenv: ^6.0.0
  dio: ^5.3.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  cached_network_image: ^3.3.0
  internet_connection_checker: ^3.0.1
  google_nav_bar: ^5.0.6
  infinite_scroll_pagination: ^4.1.0
  rxdart: ^0.28.0
  flutter_glow: ^0.3.0
  readmore: ^3.0.0
  el_tooltip: ^2.0.0
  carousel_slider: ^5.1.2
  photo_view: ^0.15.0
  injectable: ^2.3.2
  get_it: ^9.2.1
  provider: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  like_button: ^2.0.5
  nil: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.1
  injectable_generator: ^2.4.1
  build_runner: ^2.4.6
  import_sorter: ^4.6.0
  flutter_native_splash: ^2.3.5
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  image: assets/splash.png
  color: "#021f44"

flutter_launcher_icons:
  image_path: assets/logo.png
  android: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/

  fonts:
    - family: MyIcons
      fonts:
      - asset: assets/MyIcons.ttf